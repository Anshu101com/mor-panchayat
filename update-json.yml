name: Automatically Update update.json

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_DATE: ${{ github.event.release.published_at }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          REPO: ${{ github.repository }}
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from datetime import datetime

          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["REPO"]
          release_tag = os.environ.get("RELEASE_TAG", "")
          release_name = os.environ.get("RELEASE_NAME", "")
          release_body = os.environ.get("RELEASE_BODY", "")
          release_date = os.environ.get("RELEASE_DATE", "")

          print("Release tag:", release_tag)
          print("Release name:", release_name)

          # ---------------------------------------------------------
          # 1. Get version from release tag/name
          # Supports:
          # v1.0.82
          # v1.0.82_Beta
          # Mor Panchayat v1.0.82 Beta
          # ---------------------------------------------------------

          version_match = re.search(
              r"v?(\d+\.\d+\.\d+(?:\+\d+)?)",
              release_tag
          )

          if not version_match:
              version_match = re.search(
                  r"v?(\d+\.\d+\.\d+(?:\+\d+)?)",
                  release_name
              )

          if not version_match:
              raise Exception(
                  f"Could not find version in release tag/name: "
                  f"{release_tag} / {release_name}"
              )

          latest_version = version_match.group(1)

          print("Detected version:", latest_version)

          # ---------------------------------------------------------
          # 2. Get the exact GitHub release
          # ---------------------------------------------------------

          api_url = (
              f"https://api.github.com/repos/{repo}/releases/tags/"
              f"{urllib.parse.quote(release_tag, safe='')}"
          )

          request = urllib.request.Request(
              api_url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "Mor-Panchayat-Update-Workflow",
              },
          )

          with urllib.request.urlopen(request) as response:
              release_data = json.loads(response.read().decode())

          # ---------------------------------------------------------
          # 3. Find APK asset
          # ---------------------------------------------------------

          apk_url = None

          for asset in release_data.get("assets", []):
              name = asset.get("name", "")

              if name.lower().endswith(".apk"):
                  apk_url = asset.get("browser_download_url")
                  print("APK found:", name)
                  print("APK URL:", apk_url)
                  break

          if not apk_url:
              raise Exception("No APK file found in this GitHub release.")

          # ---------------------------------------------------------
          # 4. Read existing update.json
          # ---------------------------------------------------------

          update_file = "update.json"

          old_data = {}

          if os.path.exists(update_file):
              try:
                  with open(update_file, "r", encoding="utf-8") as f:
                      old_data = json.load(f)
              except Exception:
                  print("Existing update.json could not be read. Using defaults.")

          # ---------------------------------------------------------
          # 5. Keep minimum version and critical setting
          # ---------------------------------------------------------

          minimum_version = old_data.get(
              "minimumVersion",
              latest_version
          )

          critical = old_data.get(
              "critical",
              False
          )

          # ---------------------------------------------------------
          # 6. Release date/time
          # ---------------------------------------------------------

          formatted_date = ""
          formatted_time = ""

          if release_date:
              try:
                  dt = datetime.fromisoformat(
                      release_date.replace("Z", "+00:00")
                  )

                  formatted_date = dt.strftime("%Y-%m-%d")
                  formatted_time = dt.strftime("%H.%M.%S")

              except Exception as e:
                  print("Date parsing failed:", e)

          # ---------------------------------------------------------
          # 7. Release notes
          # ---------------------------------------------------------

          release_notes = []

          for line in release_body.splitlines():
              line = line.strip()

              if not line:
                  continue

              # Remove markdown bullets
              line = re.sub(r"^[-*+]\s*", "", line)

              # Remove numbered bullets
              line = re.sub(r"^\d+[\.\)]\s*", "", line)

              # Remove markdown headings
              line = re.sub(r"^#+\s*", "", line)

              # Remove basic markdown formatting
              line = line.replace("**", "")
              line = line.replace("__", "")
              line = line.replace("`", "")

              if line:
                  release_notes.append(line)

          # Fallback if release has no notes
          if not release_notes:
              release_notes = [
                  f"Mor Panchayat {latest_version} update"
              ]

          # ---------------------------------------------------------
          # 8. Generate update.json
          # ---------------------------------------------------------

          new_data = {
              "latestVersion": latest_version,
              "minimumVersion": minimum_version,
              "critical": critical,
              "releaseDate": formatted_date,
              "releaseTime": formatted_time,
              "apkUrl": apk_url,
              "releaseNotes": release_notes,
          }

          with open(update_file, "w", encoding="utf-8") as f:
              json.dump(
                  new_data,
                  f,
                  indent=2,
                  ensure_ascii=False
              )
              f.write("\n")

          print("\nGenerated update.json:")
          print(json.dumps(new_data, indent=2, ensure_ascii=False))

          PY

      - name: Commit and push update.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add update.json

          if git diff --cached --quiet; then
            echo "No changes to update.json."
            exit 0
          fi

          git commit -m "Auto-update update.json for ${GITHUB_REF_NAME}"
          git push

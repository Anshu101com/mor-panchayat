name: Automatically Update update.json

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------
      # 2. Generate update.json
      # ---------------------------------------------------
      - name: Generate update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_DATE: ${{ github.event.release.published_at }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import urllib.request
          from datetime import datetime, timezone

          OWNER = "Anshu101com"
          REPO = "mor-panchayat"

          token = os.environ.get("GITHUB_TOKEN")
          release_tag = os.environ.get("RELEASE_TAG", "")
          release_name = os.environ.get("RELEASE_NAME", "")
          release_body = os.environ.get("RELEASE_BODY") or ""
          release_date = os.environ.get("RELEASE_DATE", "")
          release_prerelease = (
              os.environ.get("RELEASE_PRERELEASE", "").lower() == "true"
          )

          # ------------------------------------------------
          # Read existing update.json
          # ------------------------------------------------
          update_file = "update.json"

          old_data = {}

          if os.path.exists(update_file):
              try:
                  with open(update_file, "r", encoding="utf-8") as f:
                      old_data = json.load(f)
              except Exception:
                  old_data = {}

          # ------------------------------------------------
          # Extract clean version
          #
          # Examples:
          # v1.0.8_Beta -> 1.0.8
          # v1.0.9      -> 1.0.9
          # 1.1.0       -> 1.1.0
          # ------------------------------------------------
          version_match = re.search(
              r"(\d+\.\d+\.\d+)",
              release_tag or release_name
          )

          if not version_match:
              raise RuntimeError(
                  f"Could not determine version from release tag: {release_tag}"
              )

          latest_version = version_match.group(1)

          # ------------------------------------------------
          # Get release information directly from GitHub
          # ------------------------------------------------
          api_url = (
              f"https://api.github.com/repos/"
              f"{OWNER}/{REPO}/releases/tags/{release_tag}"
          )

          request = urllib.request.Request(
              api_url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "Mor-Panchayat-Update-Generator"
              }
          )

          with urllib.request.urlopen(request) as response:
              release = json.loads(response.read().decode("utf-8"))

          # ------------------------------------------------
          # Find APK automatically
          # ------------------------------------------------
          apk = None

          for asset in release.get("assets", []):
              name = asset.get("name", "")

              if name.lower().endswith(".apk"):
                  apk = asset
                  break

          if apk is None:
              raise RuntimeError(
                  "No APK file was found in this GitHub Release."
              )

          apk_url = apk.get("browser_download_url")

          if not apk_url:
              raise RuntimeError(
                  "APK download URL could not be determined."
              )

          # ------------------------------------------------
          # Release date and time
          # ------------------------------------------------
          published_at = (
              release.get("published_at")
              or release_date
          )

          if published_at:
              try:
                  dt = datetime.fromisoformat(
                      published_at.replace("Z", "+00:00")
                  )

                  # Convert to UTC
                  dt = dt.astimezone(timezone.utc)

                  formatted_date = dt.strftime("%Y-%m-%d")
                  formatted_time = dt.strftime("%H.%M.%S")

              except Exception:
                  formatted_date = datetime.now(
                      timezone.utc
                  ).strftime("%Y-%m-%d")

                  formatted_time = datetime.now(
                      timezone.utc
                  ).strftime("%H.%M.%S")
          else:
              now = datetime.now(timezone.utc)

              formatted_date = now.strftime("%Y-%m-%d")
              formatted_time = now.strftime("%H.%M.%S")

          # ------------------------------------------------
          # Release notes
          # ------------------------------------------------
          notes = []

          if release_body.strip():
              lines = release_body.splitlines()

              for line in lines:
                  line = line.strip()

                  if not line:
                      continue

                  # Remove Markdown bullets
                  line = re.sub(
                      r"^[\-\*\+]\s*",
                      "",
                      line
                  )

                  # Remove numbered bullets
                  line = re.sub(
                      r"^\d+[\.\)]\s*",
                      "",
                      line
                  )

                  # Remove Markdown heading markers
                  line = re.sub(
                      r"^#+\s*",
                      "",
                      line
                  )

                  # Remove simple Markdown formatting
                  line = line.replace("**", "")
                  line = line.replace("__", "")
                  line = line.replace("`", "")

                  line = line.strip()

                  if line:
                      notes.append(line)

          if not notes:
              notes = [
                  f"New Mor Panchayat version {latest_version}"
              ]

          # ------------------------------------------------
          # Preserve minimumVersion
          #
          # If update.json already has one, keep it.
          # Otherwise use the current version.
          # ------------------------------------------------
          minimum_version = old_data.get(
              "minimumVersion",
              latest_version
          )

          # ------------------------------------------------
          # Preserve critical setting
          #
          # Existing value is preserved unless the GitHub
          # Release is marked as a prerelease.
          #
          # You can manually set critical=true in the
          # existing update.json when needed.
          # ------------------------------------------------
          critical = old_data.get("critical", False)

          # ------------------------------------------------
          # Build new update.json
          # ------------------------------------------------
          new_data = {
              "latestVersion": latest_version,
              "minimumVersion": minimum_version,
              "critical": critical,
              "releaseDate": formatted_date,
              "releaseTime": formatted_time,
              "releaseNotes": notes,
              "apkUrl": apk_url
          }

          # ------------------------------------------------
          # Write update.json
          # ------------------------------------------------
          with open(
              update_file,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  new_data,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

              f.write("\n")

          print("========================================")
          print("Mor Panchayat update.json generated")
          print("========================================")
          print(f"Version:       {latest_version}")
          print(f"Release Tag:   {release_tag}")
          print(f"APK:           {apk.get('name')}")
          print(f"APK URL:       {apk_url}")
          print(f"Release Date:  {formatted_date}")
          print(f"Release Time:  {formatted_time}")
          print(f"Minimum:       {minimum_version}")
          print(f"Critical:      {critical}")
          print("========================================")
          PY

      # ---------------------------------------------------
      # 3. Commit update.json
      # ---------------------------------------------------
      - name: Commit update.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add update.json

          if git diff --cached --quiet; then
            echo "No changes to update.json."
            exit 0
          fi

          git commit -m "chore: automatically update update.json"

          git push

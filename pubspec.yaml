name: mor_panchayat
description: "A self project by Anshu101com to make its village become a advanced village and can get information wheater he/she is in the Village or Not."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.82

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  package_info_plus: ^10.2.1
  http: ^1.6.0
  dio: ^5.11.0
  path_provider: ^2.1.6
  android_intent_plus: ^5.3.1
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  


flutter:

  uses-material-design: true

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
